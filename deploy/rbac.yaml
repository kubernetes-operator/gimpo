apiVersion: v1
kind: ServiceAccount
metadata:
  name: gimpo-velero-dashboard
  namespace: velero
---
# 대시보드가 필요한 권한:
#  - velero.io 전체 CRD CRUD (백업/복구/스케줄/BSL/VSL/다운로드요청 등)
#  - 네임스페이스 목록 (NamespaceSelector) + API discovery
# 실제 백업/복구 대상 리소스에 대한 권한은 Velero 컨트롤러가 이미 보유하므로 부여하지 않는다(최소 권한).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gimpo-velero-dashboard
rules:
  - apiGroups: ["velero.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gimpo-velero-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gimpo-velero-dashboard
subjects:
  - kind: ServiceAccount
    name: gimpo-velero-dashboard
    namespace: velero
---
# velero 네임스페이스 한정 권한
#  - 상태 점검: velero 서버 Deployment, node-agent DaemonSet, 저장소 정리 Job 조회(읽기 전용)
#  - 복구 테스트 설정·이력 저장: ConfigMap gimpo-restore-test (수정은 이 이름으로만 제한)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gimpo-velero-dashboard
  namespace: velero
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets"]
    verbs: ["get", "list"]
  # 정리(maintenance) 잡: 상태 점검 조회 + 끝난 잡 자동 정리(주인 없는 잡·설정 개수 초과분 삭제)
  # + etcd 스냅샷/복원 연습 "지금 실행"(CronJob 템플릿으로 Job 생성 — 화면에서는 관리자만 가능)
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
  # etcd 잡 결과 수집: Job 파드 로그의 마지막 결과 줄을 읽는다
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # etcd 스냅샷·복원 연습 이력 저장
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["gimpo-etcd"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["gimpo-restore-test"]
    verbs: ["get", "update", "patch"]
  # Velero 정리 잡 보관 개수(keepLatestMaintenanceJobs) 읽기
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["velero-repo-maintenance"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gimpo-velero-dashboard
  namespace: velero
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gimpo-velero-dashboard
subjects:
  - kind: ServiceAccount
    name: gimpo-velero-dashboard
    namespace: velero
