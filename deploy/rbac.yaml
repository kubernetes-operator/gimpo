apiVersion: v1
kind: ServiceAccount
metadata:
  name: gimpo-velero-dashboard
  namespace: velero
---
# 대시보드가 필요한 권한:
#  - velero.io 전체 CRD CRUD (백업/복구/스케줄/BSL/VSL/다운로드요청 등)
#  - 네임스페이스 목록 (NamespaceSelector) + API discovery
# 실제 백업/복구 대상 리소스에 대한 권한은 Velero 컨트롤러가 이미 보유하므로 부여하지 않는다(최소 권한).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gimpo-velero-dashboard
rules:
  - apiGroups: ["velero.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gimpo-velero-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gimpo-velero-dashboard
subjects:
  - kind: ServiceAccount
    name: gimpo-velero-dashboard
    namespace: velero
