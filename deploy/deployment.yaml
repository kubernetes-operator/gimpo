apiVersion: apps/v1
kind: Deployment
metadata:
  name: gimpo-velero-dashboard
  namespace: velero
  labels:
    app: gimpo-velero-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gimpo-velero-dashboard
  template:
    metadata:
      labels:
        app: gimpo-velero-dashboard
    spec:
      serviceAccountName: gimpo-velero-dashboard
      containers:
        - name: dashboard
          # CI(.github/workflows/build-and-push.yml)가 GHCR 로 푸시하는 이미지.
          # 로컬 클러스터(kind 등) 테스트 시엔 gimpo-velero-dashboard:dev 로 바꾸고
          # imagePullPolicy: IfNotPresent 로 조정한다.
          image: ghcr.io/kubernetes-operator/gimpo:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: VELERO_NAMESPACE
              value: "velero"
            - name: STATIC_DIR
              value: "/app/public"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
