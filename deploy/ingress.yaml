# 선택 사항: Ingress. 클러스터의 IngressClass/호스트에 맞게 수정 후 kustomization 에 추가하세요.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gimpo-velero-dashboard
  namespace: velero
spec:
  # ingressClassName: nginx
  rules:
    - host: velero-dashboard.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gimpo-velero-dashboard
                port:
                  number: 80
